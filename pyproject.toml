[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-react-agent"
version = "0.2.0"
description = "FastAPI and LangGraph ReAct agent with hybrid knowledge retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sse-starlette==3.6.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "langchain-core==1.7.0",
    "langchain-openai==1.7.2",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary,pool]==3.3.6",
    "langchain-chroma==1.1.0",
    "langchain-huggingface==1.2.3",
    "langchain-text-splitters==1.1.3",
    "sentence-transformers==6.2.0",
    "rank-bm25==0.2.2",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
